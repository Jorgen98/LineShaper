services:
  line-shaper-api:
    container_name: line-shaper-api
    build:
      context: ./api/
      dockerfile: Dockerfile
    depends_on:
      line-shaper-db:
        condition: service_healthy
    environment:
      TZ: "Europe/Bratislava"
      EDITOR_AUTH: ${EDITOR_AUTH}
      ROUTER_AUTH: ${ROUTER_AUTH}
      NO_DOWNLOAD: ${NO_DOWNLOAD}
    restart: on-failure:3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:9004:9004"
  line-shaper-db:
    container_name: line-shaper-db
    image: postgis/postgis:16-3.7
    volumes:
      - ./api/initDB.sql:/docker-entrypoint-initdb.d/initDB.sql
      - ./postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
      PGUSER: ${DB_USER}
      TZ: "Europe/Bratislava"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${DB_DATABASE} -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
